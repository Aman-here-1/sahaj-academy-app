/* Layout: one phone-width column centred on any screen; bottom tab bar; screens swap inside. Navy ink + marigold accent, paper ground. */
:root{
  --paper:#f5f6f8; --card:#ffffff; --ink:#14213d; --muted:#5d6985; --line:#dfe3ec;
  --accent:#f2a900; --accent-ink:#2b1d00; --good:#1f8a4c; --good-bg:#e3f4ea; --bad:#c23a2b; --bad-bg:#fbe6e3;
  --navy:#14213d; --on-navy:#ffffff; --navy-soft:#26365f;
  --f-display:'Bricolage Grotesque','Noto Sans Gujarati','Hind',system-ui,sans-serif; --f-body:'Hind','Noto Sans Gujarati',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1526; --card:#172038; --ink:#eef1f8; --muted:#9aa6c4; --line:#27324f;
  --accent:#f5b72b; --accent-ink:#2b1d00; --good:#4cc283; --good-bg:#12301f; --bad:#ff7d6e; --bad-bg:#3a1a17;
  --navy:#0a1020; --on-navy:#eef1f8; --navy-soft:#1c2848; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1526; --card:#172038; --ink:#eef1f8; --muted:#9aa6c4; --line:#27324f;
  --accent:#f5b72b; --accent-ink:#2b1d00; --good:#4cc283; --good-bg:#12301f; --bad:#ff7d6e; --bad-bg:#3a1a17;
  --navy:#0a1020; --on-navy:#eef1f8; --navy-soft:#1c2848; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:0}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:480px;height:100%;margin-inline:auto;background:var(--paper);position:relative;display:flex;flex-direction:column;border-inline:1px solid var(--line)}
.scroll{flex:1;overflow-y:auto;padding:0 16px 24px;min-width:0}
.top{background:var(--navy);color:var(--on-navy);padding:18px 16px 22px;display:flex;flex-direction:column;gap:6px}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand img{height:34px;width:auto;background:#fff;border-radius:8px;padding:3px;display:block}
.hero .brand{flex-direction:column;align-items:flex-start;gap:12px}
.hero .brand img{height:96px;border-radius:14px;padding:6px}
.pdf{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.pdf .ic{width:38px;height:44px;border-radius:6px;background:var(--bad-bg);color:var(--bad);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:11px;flex:none}
.top h1{font-size:24px;font-weight:700}
.top p{margin:0;color:color-mix(in srgb,var(--on-navy) 70%,transparent);font-size:14px}
.chip{display:inline-flex;align-items:center;border:1px solid color-mix(in srgb,var(--on-navy) 35%,transparent);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:600;background:transparent;color:var(--on-navy)}
.sec{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.sec>h2{font-size:17px;font-weight:700}
.sec>.sub{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px 0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.subj{display:flex;flex-direction:column;gap:10px;text-align:left;align-items:flex-start}
.badge{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;color:#fff}
.subj b{font-family:var(--f-display);font-size:16px}
.subj small,.muted{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.item .grow{flex:1;min-width:0}
.item b{display:block;font-weight:600}
.num{font-family:var(--f-display);font-weight:800;font-size:15px;min-width:34px;height:34px;border-radius:8px;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.arrow{color:var(--muted);font-size:18px}
.pill{font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--paper);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn{border:0;border-radius:10px;padding:13px 16px;font-weight:600;font-size:15px;width:100%;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--card);color:var(--bad);border:1px solid var(--line)}
.tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{background:none;border:0;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative;min-width:0;text-align:center;line-height:1.25}
.tabbar button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.bar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--navy);color:var(--on-navy)}
.bar button{background:none;border:0;color:var(--on-navy);font-size:22px;padding:0 6px 0 0;line-height:1}
.bar h2{font-size:18px;font-weight:700;flex:1;min-width:0}
/* login */
.login{flex:1;display:flex;flex-direction:column;overflow-y:auto}
.login .hero{background:var(--navy);color:var(--on-navy);padding:40px 20px 34px;display:flex;flex-direction:column;gap:12px}
.login .hero h1{font-size:34px;font-weight:800;line-height:1.1}
.login .hero p{margin:0;color:color-mix(in srgb,var(--on-navy) 72%,transparent)}
.login form{padding:22px 20px;display:flex;flex-direction:column;gap:14px}
label{font-weight:600;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.phone{display:flex;gap:8px}
.phone .cc{padding:13px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:600}
.otp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.otp input{text-align:center;padding:13px 0;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.note{background:var(--card);border:1px dashed var(--accent);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:0}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;min-width:64px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
/* quiz */
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.q{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.35}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px}
.opt .l{font-family:var(--f-display);font-weight:800;min-width:26px;height:26px;border-radius:7px;background:var(--paper);display:grid;place-items:center;font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.score{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 16px;text-align:center}
.score .big{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:26px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats .card{text-align:center;padding:12px 6px}
.stats b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:12px}
.toast{position:absolute;left:16px;right:16px;bottom:78px;background:var(--navy);color:var(--on-navy);padding:11px 14px;border-radius:10px;font-size:14px;z-index:5}
.notice{display:flex;gap:12px;align-items:flex-start}
.notice .d{font-family:var(--f-display);font-weight:800;font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:5px 7px;text-align:center;line-height:1.1;min-width:42px}
.prose p{margin:0 0 12px}
.badge.w{width:52px;font-size:12px;letter-spacing:.02em}
@media (prefers-reduced-motion:no-preference){.scroll>*{animation:in .25s ease both}@keyframes in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}}

.pdf{width:100%;text-align:left}
.pdfwrap{flex:1;overflow:auto;background:var(--line);padding:8px;min-height:0}
.pgbox{background:#fff;margin:0 0 8px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.bar .zb{font-family:var(--f-display);font-weight:800;font-size:20px;min-width:36px;height:36px;border-radius:8px;background:color-mix(in srgb,var(--on-navy) 15%,transparent);padding:0}
.pdfmsg{padding:16px;color:var(--muted)}
.pdfmsg a{color:var(--ink)}
.langwrap{padding:18px 20px 0}
.about p{margin:0}
.aboutlogo{display:flex;gap:14px;align-items:center}
.aboutlogo img{height:72px;background:#fff;border-radius:12px;padding:5px;border:1px solid var(--line)}
.ticks,.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.ticks li{display:flex;gap:10px}
.ticks li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:8px}
.steps{counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
</style>

var MSETS=[{"id":"dir","gu":"દિશા અને અંતર","en":"Directions and Distance","q":[["કોયલ પોતાના ઘરેથી ઉત્તર દિશામાં 2 કિમી ચાલે છે. ત્યારબાદ જમણી બાજુ વળે છે, તો તેનું મોં કઈ દિશા તરફ હશે?",["પૂર્વ","ઉત્તર","પશ્ચિમ","દક્ષિણ"],0],["પૂર્વ અને દક્ષિણ દિશાઓ વચ્ચે કઈ દિશા (ખૂણો) હોય છે?",["નૈઋત્ય","વાયવ્ય","અગ્નિ","ઈશાન"],2],["Y એ X ની પૂર્વ દિશામાં છે. X એ Z ની ઉત્તર દિશામાં છે. P એ Z ની દક્ષિણ દિશામાં છે, તો P એ Y ની કઈ દિશામાં હોય?",["નૈઋત્ય","અગ્નિ","ઉત્તર","દક્ષિણ"],0],["સાગર ઘરેથી નીકળી પશ્ચિમ દિશા તરફ ચાલવાનું શરૂ કરે છે. ત્યાંથી તે ડાબી બાજુ વળીને થોડું ચાલે છે. ત્યારબાદ તે જમણી બાજુ વળે છે. તો હવે, તેનું મોં કઈ દિશા તરફ હશે?",["પશ્ચિમ","દક્ષિણ","ઉત્તર","પૂર્વ"],0],["પાયલ ઘરેથી નીકળીને ઉત્તર દિશા તરફ ચાલવાનું શરૂ કરે છે. ત્યાંથી તે જમણી બાજુ વળીને થોડું ચાલે છે. ત્યારબાદ તે ડાબી બાજુ વળી જાય છે. તો હવે તેનું મુખ કઈ દિશા તરફ હશે?",["પશ્ચિમ","પૂર્વ","દક્ષિણ","ઉત્તર"],3],["એક રેલગાડી પશ્ચિમ દિશામાં 120 કિમી ચાલે છે, પછી તે 30 કિમી દક્ષિણ દિશામાં તથા ફરી સ્ટેશન પહોંચતા પહેલા 80 કિમી પૂર્વ દિશામાં ચાલે છે. તો રેલગાડીનું આરંભ બિંદુથી સ્ટેશન કઈ દિશામાં હશે?",["ઉત્તર-પશ્ચિમ","દક્ષિણ","દક્ષિણ-પૂર્વ","દક્ષિણ-પશ્ચિમ"],3],["રવિ પ્રસ્થાન બિંદુથી શરૂઆત કરે છે. તે 3 કિમી પશ્ચિમ તરફ ચાલે છે, પછી તે પોતાની જમણી બાજુ ફરી 3 કિમી ચાલે છે. તો તેનું મોં કઈ દિશામાં હશે?",["દક્ષિણ","ઉત્તર","પૂર્વ","પશ્ચિમ"],1],["એક વિદ્યાર્થી ઉત્તર દિશામાં થોડીવાર સુધી ચાલે છે, પછી પોતાના જમણા હાથ તરફ વળી થોડું અંતર ચાલે છે અને ફરીથી થોડીવાર ઉભા રહ્યા પછી પાછો પોતાના જમણા હાથ તરફ ચાલવા લાગે છે. તો તે કઈ દિશામાં ચાલતો હશે?",["ઉત્તર","પૂર્વ","પશ્ચિમ","દક્ષિણ"],3],["એક રેલગાડી અમદાવાદથી પશ્ચિમ દિશામાં 120 કિમી અંતર કાપી ત્યાંથી દક્ષિણ બાજુ 30 કિમી અંતર કાપે છે. ત્યાંથી થોડે આગળ વધી પૂર્વ દિશામાં 120 કિમી અંતર કાપે છે અને ફરીથી ત્યાંથી દક્ષિણ બાજુ ચાલવા લાગે છે, તો તે અત્યારે અમદાવાદથી કઈ દિશામાં હશે?",["પૂર્વ","પશ્ચિમ","ઉત્તર","દક્ષિણ"],3],["હિતેન ઉત્તર દિશા તરફ મોં રાખી ઉભો છે. સવારે તેનો પડછાયો કઈ દિશામાં પડશે?",["પૂર્વ","દક્ષિણ","પશ્ચિમ","ઉત્તર"],2],["એક માણસ પૂર્વમાં અમુક અંતર કાપીને હવે તે દક્ષિણમાં જાય છે, ત્યારબાદ અમુક સમય પછી તે પોતાની ડાબી બાજુ વળે છે, તો હવે તે માણસ કઈ દિશામાં ચાલે છે?",["પૂર્વ","ઉત્તર","દક્ષિણ","પશ્ચિમ"],0],["સૂર્યાસ્ત સમયે અમિત દક્ષિણ દિશા તરફ મોં રાખીને ઉભો હોય તો તેનો પડછાયો કઈ દિશા તરફ પડશે?",["પશ્ચિમ","પૂર્વ","દક્ષિણ","ઉત્તર"],1],["દિશા સૂર્યાસ્ત સમયે ઉત્તર દિશામાં મોં રાખીને ઉભી છે તો તેનો પડછાયો કઈ દિશામાં પડશે?",["પૂર્વ","દક્ષિણ","ઉત્તર","પશ્ચિમ"],0],["અનિલ સૂર્યાસ્ત સમયે સૂર્ય સામે મોં રાખીને ઉભો છે, તો તેનો જમણો હાથ કઈ દિશામાં હશે?",["પશ્ચિમ","પૂર્વ","દક્ષિણ","ઉત્તર"],3],["જય વહેલી સવારે ચાલવા જાય ત્યારે તેનો પડછાયો તેની પાછળ તરફ હોય છે. તો તે કઈ દિશામાં જતો હશે?",["પૂર્વ","દક્ષિણ","ઉત્તર","પશ્ચિમ"],0],["અગ્નિ ખૂણો કઈ બે મુખ્ય દિશાની વચ્ચે આવે છે?",["દક્ષિણ અને પશ્ચિમ","પશ્ચિમ અને ઉત્તર","ઉત્તર અને પૂર્વ","પૂર્વ અને દક્ષિણ"],3],["રમેશ સૂર્યાસ્ત સમયે ઉત્તર દિશામાં મુખ રાખીને ઉભો છે. તો તેનો પડછાયો તેની કઈ બાજુએ અને કઈ દિશામાં પડશે?",["જમણી બાજુ અને ઉત્તર દિશા","જમણી બાજુ અને પશ્ચિમ દિશા","જમણી બાજુ અને પૂર્વ દિશા","ડાબી બાજુ અને પૂર્વ દિશા"],2],["મહેશ પૂર્વ દિશા તરફ ઉભો છે, ત્યાંથી તે ડાબી બાજુ 1 કિમી જાય છે, ત્યાંથી તે ડાબી બાજુ વળી 2 કિમી જાય છે તો તે કઈ દિશામાં જતો હશે?",["પશ્ચિમ","પૂર્વ","દક્ષિણ","ઉત્તર"],0],["તમારા ઘરેથી શાળા પૂર્વ દિશામાં હોય તો શાળાથી કઈ દિશામાં તમારું ઘર આવેલું છે?",["ઉત્તર","પશ્ચિમ","પૂર્વ","દક્ષિણ"],1],["ઉત્તર અને પશ્ચિમ વચ્ચે કઈ ઉપદિશા (ખૂણો) આવેલી હોય છે?",["વાયવ્ય","નૈઋત્ય","ઈશાન","અગ્નિ"],0],["અજય પૂર્વ દિશામાં 12 કિમી કાર ચલાવે છે, પછી ઉત્તર દિશામાં વળીને 5 કિમી જાય છે. તે પોતાના પ્રારંભિક સ્થળથી સીધા અંતરે કેટલા કિમી દૂર હશે?",["10 કિમી","7 કિમી","17 કિમી","13 કિમી"],3],["સવારે બે મિત્રો રામ અને શ્યામ સામસામે ઊભા રહીને વાતો કરે છે. રામનો પડછાયો શ્યામની બિલકુલ ડાબી બાજુ પડે છે, તો રામનું મોં કઈ દિશામાં હશે?",["ઉત્તર","પશ્ચિમ","દક્ષિણ","પૂર્વ"],2],["ગુજરાતના નકશામાં અમદાવાદને કેન્દ્ર ગણીએ તો ગાંધીનગર અને દાહોદ અનુક્રમે કઈ દિશાઓમાં આવેલા છે?",["ગાંધીનગર: ઉત્તર, દાહોદ: પશ્ચિમ","ગાંધીનગર: દક્ષિણ, દાહોદ: પૂર્વ","ગાંધીનગર: પૂર્વ, દાહોદ: દક્ષિણ","ગાંધીનગર: ઉત્તર, દાહોદ: પૂર્વ"],3],["એક માણસ દક્ષિણ તરફ 10 મીટ ખ્યાઓ છે?",["15","16","17","19"],1]]},{"id":"avg","gu":"સરાસરી (Average)","en":"Average","q":[["12, 18, 25, 35 અને 40 ની સરાસરી શોધો.",["24","28","25","26"],3],["પ્રથમ 20 પ્રાકૃતિક (Natural) સંખ્યાઓની સરાસરી કેટલી થાય?",["10.5","10","11","20.5"],0],["પ્રથમ 25 એકી (Odd) સંખ્યાઓની સરાસરી શોધો.",["26","24","25","13"],2],["પ્રથમ 15 બેકી (Even) સંખ્યાઓની સરાસરી કેટલી થશે?",["17","16","14","15"],1],["5 ના પ્રથમ 6 ગુણકો (Multiples) ની સરાસરી કેટલી થાય?",["15","17.5","20","18.5"],1],["5 ક્રમિક સંખ્યાઓની સરાસરી 28 છે. તેમાં સૌથી મોટી સંખ્યા કઈ હશે?",["29","32","31","30"],3],["8 અવલોકનોની સરાસરી 30 છે. જો દરેક અવલોકનમાં 4 ઉમેરવામાં આવે, તો નવી સરાસરી કેટલી થશે?",["32","38","34","33"],2],["10 સંખ્યાઓનો સરવાળો 450 છે. તો તે સંખ્યાઓની સરાસરી શોધો.",["45","4.5","40","50"],0],["6 વિદ્યાર્થીઓના ગુણ 42, 58, 65, 70, 55 અને 70 છે. વિદ્યાર્થીઓના સરેરાશ ગુણ શોધો.",["62","58","65","60"],3],["4 સંખ્યાઓની સરાસરી 18 છે. જો તેમાં 5મી સંખ્યા x ઉમેરવામાં આવે તો નવી સરાસરી 20 થાય છે. તો x શોધો.",["32","20","28","24"],2],["7 વ્યક્તિઓની સરેરાશ ઉંમર 20 વર્ષ છે. એક નવો વ્યક્તિ જૂથમાં ઉમેરાતા સરેરાશ ઉંમર 22 વર્ષ થાય છે. નવા વ્યક્તિની ઉંમર કેટલી?",["38","36","34","32"],1],["એક વર્ગના 25 વિદ્યાર્થીઓની સરેરાશ ઉંમર 12 વર્ષ છે. જો શિક્ષકની ઉંમર ઉમેરવામાં આવે તો સરેરાશ 13 વર્ષ થાય છે. શિક્ષકની ઉંમર શોધો.",["25","40","38","36"],2],["એક કાર A થી B તરફ 30 km/h ની ઝડપે જાય છે અને B થી A તરફ 60 km/h ની ઝડપે પાછી ફરે છે. સરેરાશ ઝડપ શોધો.",["45","40","42","50"],1],["6 સંખ્યાઓની સરાસરી 15 છે. જો તેમાંથી એક સંખ્યા દૂર કરાય, તો બાકીની સંખ્યાઓની સરાસરી 12 થાય છે. દૂર કરેલી સંખ્યા શોધો.",["27","20","30","33"],2],["11 સંખ્યાઓની સરાસરી 40 છે. જો પ્રથમ 6 સંખ્યાઓની સરાસરી 38 હોય અને અંતિમ 6 સંખ્યાઓની સરાસરી 43 હોય, તો 6ઠ્ઠી સંખ્યા કઈ હશે?",["48","41","42","46"],3],["એક ક્રિકેટર 4 ઇનિંગ્સમાં 40, 50, 35 અને 55 રન કરે છે. 5મી ઇનિંગ્સમાં કેટલા રન કરવા પડે જેથી સરેરાશ 48 રન થાય?",["50","66","60","48"],2],["સપ્તાહના પ્રથમ 3 દિવસનું સરેરાશ તાપમાન 30°C અને પછીના 3 દિવસનું સરેરાશ તાપમાન 34°C છે. જો સમગ્ર સપ્તાહનું સરેરાશ તાપમાન 32°C હોય, તો છેલ્લા 7મા દિવસનું તાપમાન શોધો.",["30","36","32","34"],2],["15 અવલોકનોની સરાસરી 50 ગણવામાં આવી હતી. પાછળથી માલૂમ પડ્યું કે એક અવલોકન 70 ને બદલે ભૂલથી 40 લેવાઈ ગયું હતું. સાચી સરાસરી શોધો.",["51","54","52","48"],2],["એક ક્રિકેટરની 9 ઇનિંગ્સની સરેરાશ રન સંખ્યા અમુક હતી. 10મી ઇનિંગ્સમાં તેણે 100 રન બનાવ્યા, જેથી તેની સરેરાશ 8 રન વધી ગઈ. તો તેની નવી સરેરાશ રન સંખ્યા કેટલી થશે?",["30","20","28","38"],2],["4 વર્ષ પહેલાં 4 સભ્યોના એક પરિવારની સરેરાશ ઉંમર 18 વર્ષ હતી. એક બાળકના જન્મ પછી પણ આજે પરિવારની સરેરાશ ઉંમર 18 વર્ષ જ રહે છે. બાળકની વર્તમાન ઉંમર કેટલી?",["1","4","2","3"],2],["40 વિદ્યાર્થીઓના વર્ગમાં છોકરાઓની સરેરાશ ઉંમર 16 વર્ષ અને છોકરીઓની સરેરાશ ઉંમર 12 વર્ષ છે. વર્ગની કુલ સરેરાશ ઉંમર 15 વર્ષ હોય તો વર્ગમાં છોકરાઓની સંખ્યા શોધો.",["32","25","20","30"],3],["એક વેપારીની પ્રથમ 5 મહિનાની સરેરાશ વેચાણ રકમ 5,200 રૂપિયા છે. 6ઠ્ઠા મહિનામાં કેટલું વેચાણ કરવું પડે જેથી 6 મહિનાની સરેરાશ વેચાણ રકમ 5,500 રૂપિયા થાય?",["7,500","7,000","5,800","6,500"],1],["3 ક્રમિક એકી સંખ્યાઓની સરાસરી અને પછીની 3 ક્રમિક એકી સંખ્યાઓની સરાસરી વચ્ચેનો તફાવત કેટલો થાય?",["3","6","8","4"],1],["એક વર્ગના 20 વિદ્યાર્થીઓની સરેરાશ લંબાઈ 150 cm છે. પાછળથી જાણવા મળ્યું કે 140 cm લંબાઈ ધરાવતા વિદ્યાર્થીની લંબાઈ ભૂલથી 160 cm નોંધાઈ ગઈ હતી. સાચી સરેરાશ લંબાઈ શોધો (cm).",["149","148","151","145"],0],["5 સંખ્યાઓની સરાસરી 50 છે. પ્રથમ બે સંખ્યાઓની સરાસરી 45 અને અંતિમ બે સંખ્યાઓની સરાસરી 55 છે. તો ત્રીજી (વચલી) સંખ્યા શોધો.",["45","55","50","52"],2]]},{"id":"nav1","gu":"અવયવ, અવયવી, ગુ.સા.અ. અને લ.સા.અ.","en":"Factors, Multiples, HCF and LCM","q":[["બે સંખ્યાઓના ગુ.સા.અ. (H.C.F.) તથા લ.સા.અ. (L.C.M.) નો ગુણાકાર 384 છે. જો તેમાંથી એક સંખ્યા 24 હોય, તો બીજી સંખ્યા કઈ હશે?",["12","14","18","16"],3],["100 ના અવયવોની કુલ સંખ્યા કેટલી થાય?",["9","7","10","8"],0],["સંખ્યાઓ 14, 36 અને 66 નો ગુ.સા.અ. શોધો.",["4","1","6","2"],3],["32 ના અવિભાજ્ય અવયવો કયા મળે?",["2 અને 4","ફક્ત 2","2, 4 અને 8","2 અને 16"],1],["8 અને 12 ના પ્રથમ ત્રણ સામાન્ય અવયવીઓ (ગુણાકારો) કયા છે?",["24, 48, 72","8, 16, 24","24, 36, 48","12, 24, 36"],0],["A વાસણ અને B વાસણમાં ક્રમશઃ 145 લિટર અને 116 લિટર દૂધ છે. મોટામાં મોટા માપક વાસણનું કદ કેટલું હશે જે બંને વાસણોના દૂધને પૂરેપૂરું માપી શકે?",["58 લિટર","29 લિટર","19 લિટર","31 લિટર"],1],["120, 240 અને 360 નો લ.સા.અ. કેટલો થાય?",["480","360","720","1440"],2],["95 અને 114 નો લ.સા.અ. શોધો.",["1140","570","10830","285"],1],["200, 288 અને 252 નો ગુ.સા.અ. શોધો.",["2","4","6","8"],1],["એવી મોટામાં મોટી સંખ્યા શોધો જેનાથી 140 અને 155 ને ભાગતાં દરેક વખતે 5 શેષ વધે?",["10","15","25","5"],1],["3 અંકની મોટામાં મોટી સંખ્યા કઈ છે જે 8, 10 અને 12 વડે નિઃશેષ ભાગી શકાય?",["840","990","960","980"],2],["સંખ્યાઓ 24, 36 અને 42 નો લ.સા.અ. શોધો.",["336","1008","252","504"],3],["42, 98 અને 70 વડે ભાગી શકાય એવી નાનામાં નાની સંખ્યા કઈ?",["2940","1470","490","735"],1],["16, 48 અને 80 નો લ.સા.અ. શોધો.",["160","240","480","720"],1],["ત્રણ ઘડિયાળ અનુક્રમે 12, 15 અને 18 મિનિટના અંતરે વાગે છે. જો ત્રણે ઘડિયાળ સવારે 9 વાગ્યે એક સાથે વાગી હોય, તો ફરીથી કેટલા વાગ્યે ત્રણે એક સાથે વાગશે?",["બપોરે 2:00 વાગ્યે","સવારે 11:00 વાગ્યે","બપોરે 12:00 વાગ્યે","બપોરે 1:00 વાગ્યે"],2],["ત્રણ ટ્રાફિક સિગ્નલ અનુક્રમે 10, 15 અને 20 મિનિટના અંતરે એક સાથે બદલાય છે. જો સવારે 6:10 વાગ્યે ત્રણેય સિગ્નલ એક સાથે બદલાયા હોય, તો ફરીથી કેટલા વાગ્યે એક સાથે બદલાશે?",["સવારે 7:10 વાગ્યે","સવારે 7:00 વાગ્યે","સવારે 8:10 વાગ્યે","સવારે 6:40 વાગ્યે"],0],["ત્રણ અંકોની નાનામાં નાની સંખ્યા શોધો કે જેને 6 અને 8 વડે નિઃશેષ ભાગી શકાય.",["96","108","104","120"],3],["બે નાનામાં નાની અવિભાજ્ય સંખ્યાઓનો લ.સા.અ. કેટલો થાય?",["2","5","6","3"],2],["સંખ્યાઓ 18, 24 અને 30 ના લ.સા.અ. અને ગુ.સા.અ. નો તફાવત શોધો.",["350","354","364","360"],1]]},{"id":"nav2","gu":"ક્ષેત્રફળ, પરિમિતિ અને ઘનફળ","en":"Area, Perimeter and Volume","q":[["એક સાબુની લંબાઈ, પહોળાઈ અને ઊંચાઈ અનુક્રમે 7 સેમી, 5 સેમી અને 2.5 સેમી છે. એક કાર્ટનની લંબાઈ, પહોળાઈ અને ઊંચાઈ અનુક્રમે 56 સેમી, 25 સેમી, 40 સેમી હોય, તો કાર્ટનમાં વધુમાં વધુ કેટલા સાબુ સમાઈ શકે?",["560","320","700","640"],3],["એક ચોરસનું ક્ષેત્રફળ 100 ચો.મી. છે, તો તેની પરિમિતિ કેટલી થાય?",["20 મી.","50 /* ---------- In-app PDF viewer (pdf.js) ---------- */
var PDFTOK=0,ZOOMS=[1,1.5,2,3];
function viewPdf(){
  return '<div class="bar"><button data-act="pdfback" aria-label="'+L('Back','પાછળ')+'">&#8592;</button><h2>'+esc(S.pdf.t)+'</h2><button class="zb" data-act="pdfzoom" data-v="-" aria-label="'+L('Zoom out','નાનું કરો')+'">&minus;</button><button class="zb" data-act="pdfzoom" data-v="+" aria-label="'+L('Zoom in','મોટું કરો')+'">+</button></div><div class="pdfwrap" id="pdfwrap"><p class="pdfmsg">'+L('Opening...','ખુલી રહ્યું છે...')+'</p></div>';
}
function pdfFail(wrap,tok){
  if(tok!==PDFTOK)return;
  wrap.innerHTML='<p class="pdfmsg">'+L('This PDF could not be opened.','આ PDF ખુલી શકી નથી.')+' <a href="'+esc(S.pdf.f)+'" target="_blank" rel="noopener">'+L('Open in browser','બ્રાઉઝરમાં ખોલો')+'</a></p>';
}
function mountPdf(){
  var tok=++PDFTOK,wrap=document.getElementById('pdfwrap');
  if(!wrap)return;
  if(!window.pdfjsLib){pdfFail(wrap,tok);return;}
  try{pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';}catch(e){}
  var zoom=S.pdf.zoom||1;
  pdfjsLib.getDocument(S.pdf.f).promise.then(function(doc){
    if(tok!==PDFTOK)return;
    var w=Math.max(260,wrap.clientWidth-16)*zoom,dpr=Math.min(window.devicePixelRatio||1,2),ps=[];
    for(var i=1;i<=doc.numPages;i++)ps.push(doc.getPage(i));
    return Promise.all(ps).then(function(pgs){
      if(tok!==PDFTOK)return;
      wrap.innerHTML='';
      var obs=new IntersectionObserver(function(es){es.forEach(function(e){var bx=e.target;bx._vis=e.isIntersecting;if(e.isIntersecting)draw(bx);else if(bx._on){bx.innerHTML='';bx._on=false;}});},{root:wrap,rootMargin:'900px 0px'});
      function draw(bx){
        if(bx._on||bx._busy)return;bx._busy=true;
        var pg=bx._pg,sc=w/pg.getViewport({scale:1}).width,vp=pg.getViewport({scale:sc*dpr}),c=document.createElement('canvas');
        c.width=vp.width;c.height=vp.height;c.style.width=w+'px';c.style.height=(vp.height/dpr)+'px';
        pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise.then(function(){
          bx._busy=false;
          if(tok===PDFTOK&&bx._vis){bx.innerHTML='';bx.appendChild(c);bx._on=true;}
        },function(){bx._busy=false;});
      }
      pgs.forEach(function(pg){
        var v0=pg.getViewport({scale:1}),bx=document.createElement('div');
        bx.className='pgbox';bx.style.width=w+'px';bx.style.height=(w*v0.height/v0.width)+'px';bx._pg=pg;
        wrap.appendChild(bx);obs.observe(bx);
      });
    });
  }).catch(function(){pdfFail(wrap,tok);});
}
function startExamQuiz(ex,k,from){
  var m=curMed();
  S.test={key:ex+'-'+k+'-'+m,meta:{x:ex,k:k,m:m},qs:exQs(ex,k,m),i:0,ans:[],from:from};S.screen='quiz';render();
}
function goBack(){
  var s=S.screen;
  if(s==='pdf'){PDFTOK++;S.screen=S.pdf.from||'main';S.pdf=null;render();return true;}
  if(s==='quiz'||s==='result'){var fr=S.test&&S.test.from;S.test=null;S.screen=fr==='exam'?'extopics':fr==='mhub'?'mhub':fr==='evhub'?'evhub':'main';if(fr==='main'||fr==='examdirect')S.tab='tests';render();return true;}
  if(s==='evhub'){S.screen='main';S.tab='tests';render();return true;}
  if(s==='mhub'){S.screen='main';S.tab='tests';render();return true;}
  if(s==='extopics'){S.screen=isExam(S.user)?'main':'exam';render();return true;}
  if(s==='exam'){S.screen='main';render();return true;}
  if(s==='chapter'){S.screen='chapters';render();return true;}
  if(s==='chapters'){S.screen='main';S.tab='study';render();return true;}
  if(s==='main'&&S.tab!=='home'){S.tab='home';render();return true;}
  return false;
}

/* ---------- Login logic ---------- */
function bindLogin(){
  var fp=document.getElementById('f-phone'),fo=document.getElementById('f-otp'),fs=document.getElementById('f-setup');
  if(fp){fp.addEventListener('submit',function(e){e.preventDefault();var v=document.getElementById('mob').value.replace(/\D/g,'');
    if(!/^[6-9]\d{9}$/.test(v)){S.phone=v;S.err='phone';render();return;}
    S.phone=v;S.sentOtp=String(100000+Math.floor(Math.random()*900000));S.err='';S.step='otp';render();});}
  if(fo){var ins=[].slice.call(fo.querySelectorAll('.otp input'));
    ins.forEach(function(inp,i){
      inp.addEventListener('input',function(){inp.value=inp.value.replace(/\D/g,'').slice(0,1);if(inp.value&&ins[i+1])ins[i+1].focus();});
      inp.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!inp.value&&ins[i-1])ins[i-1].focus();});
      inp.addEventListener('paste',function(e){var t=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);if(t){e.preventDefault();t.split('').forEach(function(ch,j){if(ins[j])ins[j].value=ch;});}});
    });
    if(ins[0])ins[0].focus();
    fo.addEventListener('submit',function(e){e.preventDefault();var code=ins.map(function(x){return x.value;}).join('');
      if(code!==S.sentOtp){S.err='otp';document.getElementById('err').textContent=errText();return;}
      S.err='';var old=null;try{old=JSON.parse(localStorage.getItem('vp_user')||'null');}catch(x){}
      if(old&&old.mobile===S.phone){S.user=old;S.screen='main';S.tab='home';save();render();}
      else{S.step='setup';S.draftName='';S.draftCls=null;render();}});}
  if(fs){fs.addEventListener('submit',function(e){e.preventDefault();var n=document.getElementById('nm').value.trim();S.draftName=n;
    if(n.length<2){S.err='name';render();return;}
    if(!S.draftCls){S.err='cls';render();return;}
    S.err='';S.user={name:n,mobile:S.phone,cls:S.draftCls,med:S.lang};S.screen='main';S.tab='home';save();render();});}
}

/* ---------- Events ---------- */
function keepScroll(){var sc=document.querySelector('.scroll');S.keepScroll=sc?sc.scrollTop:0;}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),v=el.getAttribute('data-v');
  if(act==='lang'){
    var mob=document.getElementById('mob');if(mob)S.phone=mob.value.replace(/\D/g,'');
    var nm=document.getElementById('nm');if(nm)S.draftName=nm.value;
    keepScroll();S.lang=v;saveLang();render();
  }
  else if(act==='changenum'){S.step='phone';S.err='';render();}
  else if(act==='pickcls'){var nm2=document.getElementById('nm');if(nm2)S.draftName=nm2.value;S.draftCls=parseTrack(v);S.err='';render();}
  else if(act==='tab'){S.tab=v;S.screen='main';render();}
  else if(act==='subject'){S.subj=v;S.screen='chapters';render();}
  else if(act==='back-study'){S.screen='main';S.tab='study';render();}
  else if(act==='chapter'){S.chapter=+v;S.screen='chapter';render();}
  else if(act==='back-chapters'){S.screen='chapters';render();}
  else if(act==='pdf'){toast(L('Demo app: the chapter PDF will open here.','ડેમો એપ: અહીં પ્રકરણની PDF ખુલશે.'));}
  else if(act==='starttest'){
    var key=S.user.cls+'-'+v,qs=classQs(key);
    if(!qs.length){toast(L('This test will be added soon.','આ ટેસ્ટ જલ્દી ઉમેરાશે.'));return;}
    S.test={key:key,meta:{c:S.user.cls,k:v},qs:qs,i:0,ans:[],from:'main'};S.screen='quiz';render();}
  else if(act==='opt'){S.test.ans[S.test.i]=+v;render();}
  else if(act==='next'){
    var t=S.test;
    if(t.i<t.qs.length-1){t.i++;render();}
    else{var sc=0;t.qs.forEach(function(q,i){if(t.ans[i]===q.a)sc++;});
      S.results.push({key:t.key,meta:t.meta,score:sc,total:t.qs.length,ts:Date.now()});save();S.screen='result';render();}}
  else if(act==='quit'){goBack();}
  else if(act==='exam'){S.ex={exam:v};S.screen='exam';render();}
  else if(act==='exback'){S.screen='main';render();}
  else if(act==='med'){S.user.med=v;save();keepScroll();render();}
  else if(act==='exsubj'){S.ex=S.ex||{};if(isExam(S.user))S.ex.exam=S.user.cls;S.ex.subj=v;S.screen='extopics';render();}
  else if(act==='back-exam'){S.screen=isExam(S.user)?'main':'exam';render();}
  else if(act==='extest'){startExamQuiz(S.ex.exam,S.ex.subj,'exam');}
  else if(act==='evhub'){S.ex={exam:S.user.cls,subj:'env'};S.screen='evhub';render();}
  else if(act==='evset'){startEvset(isExam(S.user)?S.user.cls:S.ex.exam,v,S.screen==='extopics'?'exam':'evhub');}
  else if(act==='mhub'){S.ex={exam:S.user.cls,subj:'mth'};S.screen='mhub';render();}
  else if(act==='mset'){startMset(isExam(S.user)?S.user.cls:S.ex.exam,v,S.screen==='extopics'?'exam':S.screen==='mhub'?'mhub':'examdirect');}
  else if(act==='exquiz'){startExamQuiz(S.user.cls,v,S.screen==='mhub'?'mhub':S.screen==='evhub'?'evhub':'examdirect');}
  else if(act==='openpdf'){S.pdf={f:el.getAttribute('data-f'),t:el.getAttribute('data-t'),from:S.screen,zoom:1};S.screen='pdf';render();}
  else if(act==='pdfback'){goBack();}
  else if(act==='pdfzoom'){var zi=ZOOMS.indexOf(S.pdf.zoom||1);zi=Math.max(0,Math.min(ZOOMS.length-1,zi+(v==='+'?1:-1)));S.pdf.zoom=ZOOMS[zi];mountPdf();}
  else if(act==='setcls'){S.user.cls=parseTrack(v);save();keepScroll();render();toast(clsName(S.user.cls)+L(' selected.',' પસંદ કર્યું.'));}
  else if(act==='logout'){S.user=null;S.results=[];clearSaved();S.screen='login';S.step='phone';S.phone='';S.err='';render();}
});
function exQs(ex,k,m){return EXD[ex][k].q.map(function(r){return m==='gu'?Q(r[3],r[4],r[2]):Q(r[0],r[1],r[2]);});}

try{var CAP=window.Capacitor,APP=CAP&&CAP.Plugins&&CAP.Plugins.App;if(APP&&APP.addListener)APP.addListener('backButton',function(){if(!goBack())APP.exitApp();});}catch(e){}
load();render();
</script>
